Color" viewbox="0 0 24 24"><path d="M12 2c-1.5 3-4 5.5-4 9 0 3.3 2.7 6 6 6s6-2.7 6-6c0-3.5-2.5-6-4-9-1.5 2-2.5 3.5-2.5 5 0 .8.7 1.5 1.5 1.5.3 0 .6-.1.8-.3C17.6 10.3 17 8.5 16 7c0 3-1.5 5-3 6-.5.3-1 .5-1.5.5-1.4 0-2.5-1.1-2.5-2.5 0-2 1.5-4 3-6.5z"></path></svg></div><span class="font-bold text-headline-sm text-secondary tracking-tight leading-none">7 Days Streak</span></div></div></div>
<div class="text-center px-space-xs mt-space-sm">

<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight mb-space-xs">One Week</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto leading-relaxed">
        7 consecutive days of quiet Scripture reading and reflection. You did something truly meaningful.

<div class="grid grid-cols-2 gap-space-sm w-full mt-space-md"><div class="flex items-center gap-3 p-space-sm rounded-xl bg-surface-container-lowest shadow-sm"><div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed shrink-0"><svg class="w-5 h-5 text-primary" fill="currentColor" viewbox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C14.96 14.9 12.96 18.3 11 21z"></path></svg></div><div class="min-w-0 flex flex-col"><span class="text-xs text-on-surface-variant leading-none font-medium">Experience</span><span class="font-title-md text-title-md text-primary font-bold mt-1">+25 XP</span></div></div><div class="flex items-center gap-3 p-space-sm rounded-xl bg-surface-container-lowest shadow-sm"><div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed shrink-0"><svg class="w-5 h-5 text-secondary" fill="currentColor" viewbox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"></path></svg></div><div class="min-w-0 flex flex-col"><span class="text-xs text-on-surface-variant leading-none font-medium">Status</span><span class="font-title-md text-title-md text-secondary font-bold mt-1 truncate">Protected</span></div></div></div>

<button class="w-full h-12 rounded-full bg-surface-container text-primary font-label-lg text-label-lg flex items-center justify-center gap-2 transition-transform active:scale-98 select-none" id="shareBtn"><svg class="w-5 h-5 mr-1 text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" x2="12" y1="2" y2="15"></line></svg><span>Share Achievement</span></button>

<div class="pointer-events-none absolute inset-0 overflow-hidden z-30" id="confettiContainer"></div>
</div>
<script>
  (function() {
    const container = document.getElementById('confettiContainer');
    const colors = ['#006964', '#fea619', '#ab3035', '#94f3eb', '#ffddb8'];
    
    function createBurst() {
      if (!container) return;
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.floor(Math.random() * 8) + 6;
        const startX = 50 + (Math.random() * 20 - 10);
        const startY = 32;
        const angle = Math.random() * 360;
        const velocity = 80 + Math.random() * 120;
        const rad = (angle * Math.PI) / 180;
        const tx = Math.cos(rad) * velocity;
        const ty = Math.sin(rad) * velocity + 40;
        
        p.className = 'absolute rounded-sm pointer-events-none';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = color;
        p.style.left = startX + '%';
        p.style.top = startY + '%';
        p.style.opacity = '1';
        p.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
        p.style.transition = 'transform 1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1s ease-out';
        
        container.appendChild(p);
        
        requestAnimationFrame(() => {
          p.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${angle * 2}deg)`;
          p.style.opacity = '0';
        });
        
        setTimeout(() => {
          if (p.parentNode) p.parentNode.removeChild(p);
        }, 1100);
      }
    }

    createBurst();

    const awesomeBtn = document.getElementById('awesomeBtn');
    if (awesomeBtn) {
      awesomeBtn.addEventListener('click', () => {
        createBurst();
      });
    }

    const shareBtn = document.getElementById('shareBtn');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: 'Achievement Unlocked: One Week!',
            text: 'I completed 7 consecutive days of quiet Scripture reading and reflection!',
            url: window.location.href
          }).catch(() => {});
        } else {
          createBurst();
        }
      });
    }
  })();
</script></main>
