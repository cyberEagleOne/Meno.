<script>
  (function() {
    const track = document.getElementById('loading-track');
    const status = document.getElementById('splash-status');
    if (!track || !status) return;

    const stages = [
      { progress: '45%', text: 'Lighting your lamp\u2026' },
      { progress: '78%', text: 'Preparing quiet reflections\u2026' },
      { progress: '100%', text: 'Welcome home.' }
    ];

    let step = 0;
    const interval = setInterval(() => {
      if (step < stages.length) {
        track.style.width = stages[step].progress;
        status.style.opacity = '0';
        setTimeout(() => {
          status.textContent = stages[step].text;
          status.style.opacity = '1';
        }, 200);
        step++;
      } else {
        clearInterval(interval);
      }
    }, 1100);
  })();
